# Zitadel edge for zitadel.neptune.ph (Neptune server only). Traefik sends https://zitadel.neptune.ph here, and
# PRISM's API calls it over the private neptune-zitadel-link network. This does the routing upstream's own
# Traefik would: the login app under /ui/v2/login, everything else to the Zitadel API.

# Docker's DNS, re-asked every 10s, so recreated containers are found at their new address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare sits in front of Traefik: the visitor's address arrives in CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    # Redirects keep the scheme the visitor used (https at Cloudflare) instead of this hop's http.
    absolute_redirect off;

    # Container names, which Docker keeps unique; this container also sits on networks other stacks use.
    set $zitadel_api http://neptune-zitadel-zitadel-api-1:8080;
    set $zitadel_login http://neptune-zitadel-zitadel-login-1:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = / {
        return 302 /ui/v2/login/;
    }

    location /ui/v2/login {
        proxy_pass $zitadel_login;
    }

    location / {
        proxy_pass $zitadel_api;
        proxy_read_timeout 120s;
    }
}
