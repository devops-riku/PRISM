# Neptune server only (loaded through COMPOSE_FILE in .env). zitadel.neptune.ph, kept off everything shared
# on the box, including Task Queue's own Zitadel (taskq-zitadel):
# - its own project and network names (upstream uses the global network name "zitadel");
# - no published ports, and upstream's own Traefik (which would watch every container on the host) stays off;
# - upstream's Traefik labels are dropped, so the shared Traefik never routes to these containers;
# - neptune-zitadel-edge is the only container on the shared network, and the only one on
#   neptune-zitadel-link, the private link PRISM's API uses to reach Zitadel.
name: neptune-zitadel

services:
  proxy:
    profiles: ["upstream-proxy"]
    ports: !reset []

  zitadel-api:
    labels: !reset []
    environment:
      # A short-lived instance-owner token for the one-time setup (PRISM org, service account, SMTP).
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2026-10-29T00:00:00Z"
      # Sign-up happens in the apps (PRISM) only.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      # The droplet blocks outgoing 25, 465 and 587; Resend also listens on 2587 (STARTTLS).
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: smtp.resend.com:2587
      # No username or password here: v4 ignores the documented SMTP_USER / SMTP_PASSWORD names and stores a
      # provider without credentials. The active provider is added through the admin API
      # (POST /admin/v1/email/smtp, user "resend", password RESEND_SMTP_PASSWORD from .env).
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "true"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: invites@neptune.ph
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: PRISM

  zitadel-login:
    labels: !reset []

  neptune-zitadel-edge:
    image: nginx:1.29-alpine
    container_name: neptune-zitadel-edge
    volumes:
      - ./neptune-edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zitadel
      - traefik
      - link
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: asseqr-system_app-network
      traefik.http.routers.neptune-zitadel.rule: Host(`zitadel.neptune.ph`)
      traefik.http.routers.neptune-zitadel.entrypoints: websecure
      traefik.http.routers.neptune-zitadel.tls.certresolver: letsencrypt
      traefik.http.services.neptune-zitadel.loadbalancer.server.port: "80"

networks:
  zitadel:
    name: neptune-zitadel
  traefik:
    external: true
    name: asseqr-system_app-network
  link:
    external: true
    name: neptune-zitadel-link
