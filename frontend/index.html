<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PRISM | AI Quotation &amp; Requirements Builder</title>
    <meta
      name="description"
      content="Turn one project brief into a review-ready client quotation and a discipline-specific requirements sheet, both rendered from the same checked estimate."
    />
    <meta name="application-name" content="PRISM" />
    <link rel="canonical" href="https://prism.neptune.ph/" />

    <!-- Only the signed-out landing page is public. Every in-app screen is a
         hash route, including client and invitation links whose fragments can
         contain bearer credentials. Fragments never reach robots.txt, so this
         decision has to happen in the document before the application starts. -->
    <meta
      id="robots-meta"
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <script>
      ;(function () {
        var meta = document.getElementById('robots-meta')
        if (!meta) return

        function updateRobots() {
          var query = new URLSearchParams(window.location.search)
          var authReturn =
            query.has('code') || query.has('error') || query.has('error_code')
          meta.setAttribute(
            'content',
            window.location.pathname === '/' && !window.location.hash && !authReturn
              ? 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1'
              : 'noindex, nofollow, noarchive, nosnippet, noimageindex',
          )
        }

        updateRobots()
        window.addEventListener('hashchange', updateRobots)
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRISM" />
    <meta property="og:locale" content="en_PH" />
    <meta
      property="og:title"
      content="PRISM | AI Quotation &amp; Requirements Builder"
    />
    <meta
      property="og:description"
      content="Turn one project brief into a review-ready client quotation and a discipline-specific requirements sheet, both rendered from the same checked estimate."
    />
    <meta property="og:url" content="https://prism.neptune.ph/" />
    <meta property="og:image" content="https://prism.neptune.ph/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PRISM - one scope becomes a client quotation and requirements sheet."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PRISM | AI Quotation &amp; Requirements Builder"
    />
    <meta
      name="twitter:description"
      content="Turn one project brief into a review-ready client quotation and a discipline-specific requirements sheet, both rendered from the same checked estimate."
    />
    <meta name="twitter:image" content="https://prism.neptune.ph/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="PRISM - one scope becomes a client quotation and requirements sheet."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://prism.neptune.ph/#website",
        "url": "https://prism.neptune.ph/",
        "name": "PRISM",
        "alternateName": "PRISM Quotation Builder",
        "description": "Turn one project brief into a review-ready client quotation and a discipline-specific requirements sheet, both rendered from the same checked estimate."
      }
    </script>

    <!-- The app is dark by default. src/index.css carries the authoritative
         color-scheme on html; this meta is the pre-stylesheet hint that
         agrees with it, so the browser isn't guessing light before the
         stylesheet can say otherwise. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12100e" />

    <!--
      THE THEME, DECIDED IN <head>, and the position is the whole point.

      This used to live in the boot script at the bottom of <body>, under a
      comment reading "before anything paints". It was not: the browser parses
      top-down, so #boot and its stylesheet were already in the document and
      could paint a dark splash before that line ran. A studio in light mode
      got a dark frame first - the exact flash the boot block exists to
      prevent, reintroduced by the fix for it sitting too late.

      In <head> there is no <body> yet, so nothing can have painted. The
      attribute is on <html> before the first frame either way.

      `theme-color` is updated here too rather than being a second static meta:
      it tints the browser's own chrome on mobile, and a dark strip above a
      light app is the same seam one line lower down.
    -->
    <script>
      ;(function () {
        // LIGHT UNLESS DARK WAS CHOSEN. The default flipped; the attribute's
        // meaning did not - `data-theme='light'` is still light, because that
        // is the same selector `.sheet-light` shares in index.css. So the
        // common case now WRITES the attribute rather than omitting it, and
        // this script is load-bearing rather than a nicety: if it never runs,
        // the app falls back to the dark values in `@theme`. That is why it
        // is here, in <head>, and why the try/catch defaults to light too.
        var dark = false
        try {
          dark = window.localStorage.getItem('prism.theme') === 'dark'
        } catch (e) {}
        if (!dark) {
          document.documentElement.setAttribute('data-theme', 'light')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#faf7f2')
          var s = document.querySelector('meta[name="color-scheme"]')
          if (s) s.setAttribute('content', 'light')
        }
      })()
    </script>

    <!-- The app mark: a prism as an outlined triangle on a rounded tile, with
         the spectrum it produces as three dashes beneath.

         A tab icon cannot follow a theme, so this is the DARK tile in both -
         the light one would vanish against a light tab strip. The three dashes
         are brand and never change; `src/components/PrismMark.tsx` is the
         definition the public icon files copy. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Two families, seven roles: Instrument Sans sets every heading and
      every small capital label; Figtree reads at paragraph sizes, where its
      wider apertures are easier on a long clause. Instrument Serif is held
      back for the one place a serif earns its keep - a number or a name
      being presented rather than scanned.

      A geometric sans with rounded terminals - modern without being neutral,
      and friendly without being soft, which is the line a quotation has to walk.
      It replaces Instrument Sans at the studio's request.

      Checked before adopting it, because the whole costing depends on it: the
      font carries `tnum`, so a column of money still aligns digit for digit.
      A rounded face without tabular figures would have looked better and cost
      more than it was worth.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&amp;family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap"
    />
  </head>

  <body>
    <!--
      The boot screen.

      It lives in the HTML rather than in React because it has to be on screen
      before the bundle has parsed - a loader that appears once the app is ready
      is a loader that was never needed. The mark is what the name means: the
      prism draws itself, then the spectrum arrives beneath it one band at a
      time, so a slow start looks like something working rather than something
      stuck.

      Removed by src/main.tsx the moment React has mounted.
    -->
    <!--
      These colours are a COPY of the palette in src/index.css, and they have
      to be: this screen paints before that stylesheet has loaded, which is the
      only reason it exists. They are kept in step by hand.

      Say so out loud, because the silence is what went wrong last time - this
      block sat on the pine palette through two re-skins, so the app opened
      cream, turned pine, then turned dark, and nobody noticed because nothing
      points here from anywhere. A copy that admits it is a copy can be found
      by anyone changing the palette. One that does not, cannot.
    -->
    <style>
      /* The Prism Preloader, ported from the design file the studio supplied.
         Geometry, colours, easing curves and the phase percentages are its own;
         what changed is the loop length, the typeface (the app's Figtree rather
         than Inter Tight), and the reduced-motion case, which the original did
         not carry.

         The drawing trick is worth knowing: every stroked shape declares
         `pathLength="1"`, so one dasharray of 1 and an offset from 1 to 0 draws
         it completely regardless of how long the real path is. No measuring, no
         per-shape length constants. */
      #boot {
        --mark-line: #f4f7f4;
        position: fixed;
        inset: 0;
        z-index: 100;
        --dur: 2.6s;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Flat, not a radial. The splash was the last background gradient
           in the product after `.page-glow` came out. */
        background: #12100e;
        transition: opacity 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      #boot[data-done] {
        opacity: 0;
        pointer-events: none;
      }

      #boot .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      #boot svg {
        overflow: visible;
      }

      #boot .beam {
        animation: prism-beam var(--dur) cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot .glass {
        animation: prism-fill var(--dur) ease-in-out infinite;
      }

      #boot .spark {
        transform-origin: 181px 118px;
        animation: prism-spark var(--dur) ease-out infinite;
      }

      #boot .edge {
        animation: prism-draw var(--dur) cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }

      #boot .ray-a {
        animation: prism-ray-a var(--dur) cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot .ray-b {
        animation: prism-ray-b var(--dur) cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot .ray-c {
        animation: prism-ray-c var(--dur) cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot .word {
        margin: 0;
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: #8d8478;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        animation: prism-word var(--dur) ease-in-out infinite;
      }

      @keyframes prism-draw {
        0%, 4% { stroke-dashoffset: 1; }
        22%, 78% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 1; }
      }

      @keyframes prism-beam {
        0%, 22% { stroke-dashoffset: 1; }
        38%, 80% { stroke-dashoffset: 0; }
        94%, 100% { stroke-dashoffset: 1; }
      }

      @keyframes prism-fill {
        0%, 20% { opacity: 0; }
        34%, 76% { opacity: 1; }
        92%, 100% { opacity: 0; }
      }

      @keyframes prism-ray-a {
        0%, 38% { stroke-dashoffset: 1; }
        54%, 82% { stroke-dashoffset: 0; }
        92%, 100% { stroke-dashoffset: 1; }
      }

      @keyframes prism-ray-b {
        0%, 42% { stroke-dashoffset: 1; }
        58%, 83% { stroke-dashoffset: 0; }
        93%, 100% { stroke-dashoffset: 1; }
      }

      @keyframes prism-ray-c {
        0%, 46% { stroke-dashoffset: 1; }
        62%, 84% { stroke-dashoffset: 0; }
        94%, 100% { stroke-dashoffset: 1; }
      }

      @keyframes prism-spark {
        0%, 34% { opacity: 0; transform: scale(0.4); }
        46% { opacity: 0.9; transform: scale(1); }
        62%, 80% { opacity: 0.25; transform: scale(0.8); }
        90%, 100% { opacity: 0; transform: scale(0.4); }
      }

      @keyframes prism-word {
        0%, 46% { opacity: 0; letter-spacing: 0.9em; }
        64%, 82% { opacity: 1; letter-spacing: 0.55em; }
        94%, 100% { opacity: 0; letter-spacing: 0.35em; }
      }

      /* Asked for less motion: the mark holds at the frame the loop is built
         around - the prism drawn, all three bands of the spectrum out - and
         does not cycle. */
      /* ── What the wait is actually made of ─────────────────────────────
         Three segments, and each one lights when something has genuinely
         happened: the page arrived, the app finished downloading, the app
         started. Nothing here advances on a timer, so on a fast connection
         the whole thing is gone before the second segment is noticed, and on
         a slow one it stops exactly where the loading stopped — which is the
         only useful thing a loading screen can tell you.

         No percentage, for the reason the progress bar in the app carries in
         its own comment: a number that moves while nothing is happening is a
         lie told in CSS. */
      #boot .thread {
        display: flex;
        gap: 4px;
        margin-top: 14px;
      }

      #boot .thread i {
        width: 26px;
        height: 2px;
        border-radius: 2px;
        background: #38312a;
        transition: background-color 260ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      /* One accent, not three. The mark above carries the spectrum again, and
         a bar that also ran teal-amber-coral put two spectrums on one screen
         saying different things - the logo's, which is fixed, and the
         loader's, which moves. The bar is progress; the mark is the brand. */
      #boot[data-step="1"] .thread i:nth-child(1),
      #boot[data-step="2"] .thread i:nth-child(-n + 2),
      #boot[data-step="3"] .thread i {
        background: #a8b862;
      }

      /* Only shown once the wait is long enough to be worth explaining. The
         elapsed seconds are real; the sentence is the same one the pad uses
         when it has nothing better to report. */
      #boot .note {
        margin: 10px 0 0;
        height: 1em;
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
        color: #8d8478;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      #boot[data-waiting] .note {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .beam,
        #boot .edge,
        #boot .ray-a,
        #boot .ray-b,
        #boot .ray-c,
        #boot .glass,
        #boot .word {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }

        #boot .spark { animation: none; opacity: 0.25; }
      }

      /* ── The light half ────────────────────────────────────────────────
         The splash used to stay dark in light mode. That was a known seam
         and it was written down as accepted: it is visible for well under a
         second, and making it follow the theme meant reading storage twice.
         The studio looked at it and did not accept it, which is the right
         way round - a dark full-screen flash before a light app is the most
         visible thing in the whole load.

         It costs one selector now rather than a second storage read, because
         the theme is already an attribute on <html> by the time this parses
         (see the <head> script). Same values as `src/index.css`'s light
         block, copied by hand for the same reason as everything else here:
         this screen paints before that stylesheet exists.

         The three spectrum bands are NOT listed. They are the brand mark and
         are identical in both themes; only the triangle and the chrome flip. */
      html[data-theme='light'] #boot {
        background: #faf7f2;
      }

      html[data-theme='light'] #boot .word,
      html[data-theme='light'] #boot .note {
        color: #776e63;
      }

      html[data-theme='light'] #boot .thread i {
        background: #e1d9cc;
      }

      html[data-theme='light'] #boot[data-step="1"] .thread i:nth-child(1),
      html[data-theme='light'] #boot[data-step="2"] .thread i:nth-child(-n + 2),
      html[data-theme='light'] #boot[data-step="3"] .thread i {
        background: #55631f;
      }

      /* `stroke` and `fill` are presentation ATTRIBUTES on the SVG below, and
         a stylesheet beats a presentation attribute - so these override the
         markup without it needing to know a theme exists. */
      /* One variable rather than a rule per shape: the beam, the prism's
         edge and the spark are all "the drawn line" and always agree. The
         three refracted rays are NOT here - they are the spectrum, and the
         whole point of the mark is that what comes out is not what went in. */
      html[data-theme='light'] #boot {
        --mark-line: #14392c;
      }

      html[data-theme='light'] #boot .glass {
        fill: #14392c;
        fill-opacity: 0.12;
      }
    </style>

    <div id="boot" role="status" aria-label="PRISM is starting">
      <div class="stack">
        <!-- THE MARK KEEPS ITS SPECTRUM, deliberately rather than as a colour
             sweep that missed. The tile and the triangle follow the theme;
             the three bands under it do not, because a prism that splits
             white light into one colour is not a prism, and the product is
             called PRISM.

             `#1b98a8`, `#e3ae3c` and `#d9645e` are brand. Leave them.
             `src/components/PrismMark.tsx` is the definition; this is a copy,
             because the splash paints before that bundle exists. -->
        <svg
          viewBox="0 0 420 250"
          fill="none"
          aria-hidden="true"
          style="width: 283px; height: 149px"
        >
          <!-- The same mark `src/components/PrismMark.tsx` draws, hand-copied
               because this paints before that bundle exists. `edge` is the
               boot animation's own class, reused rather than renamed: it
               draws the triangle once.

               NO SPECTRUM HERE. The mark carries three coloured dashes and
               the progress bar sits directly beneath this, so drawing both
               put two rows of three in the same place - the logo and the
               loader saying the same thing in the same shape. The bar is the
               spectrum instead, one band per completed stage.

               The tile is left off too; the splash IS the tile. -->
          <line
            class="beam"
            x1="42" y1="118" x2="176" y2="118"
            stroke="var(--mark-line)" stroke-width="2.6" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1"
          />
          <!-- The prism, with its corners turned rather than mitred: three
               quadratic curves where a polygon would have had points. -->
          <path
            class="glass"
            d="M203 65 L154.5 152 Q148 162 160 162 L260 162 Q272 162 265.5 152 L217 65 Q210 52 203 65 Z"
            fill="#c9c9c9"
            fill-opacity="0.3"
          />
          <path
            class="edge"
            d="M203 65 L154.5 152 Q148 162 160 162 L260 162 Q272 162 265.5 152 L217 65 Q210 52 203 65 Z"
            stroke="var(--mark-line)" stroke-width="3" fill="none"
            pathLength="1" stroke-dasharray="1"
          />
          <line
            class="ray-a"
            x1="242" y1="108" x2="378" y2="66"
            stroke="#1b98a8" stroke-width="2.6" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1"
          />
          <line
            class="ray-b"
            x1="244" y1="118" x2="390" y2="118"
            stroke="#e3ae3c" stroke-width="2.6" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1"
          />
          <line
            class="ray-c"
            x1="242" y1="128" x2="372" y2="170"
            stroke="#d9645e" stroke-width="2.6" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1"
          />
          <circle class="spark" cx="181" cy="118" r="5" fill="var(--mark-line)" />
        </svg>

        <p class="word">PRISM</p>

        <div class="thread" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </div>

        <p class="note"></p>
      </div>
    </div>

    <script>
      /**
       * The boot screen, paced by the load rather than by a timer.
       *
       * It used to sit for a flat 1500ms and leave — which meant a local start
       * was padded to a second and a half, and a slow one showed exactly the
       * same thing while the browser was still pulling the bundle down. The
       * screen said "starting" either way and never said "still downloading".
       *
       * Now three things move it, and all three are real:
       *
       *   1  this script runs         — the HTML arrived
       *   2  the module executes      — the app finished downloading, which is
       *                                 the part that depends on the connection
       *   3  React paints             — the app is actually up
       *
       * Steps 2 and 3 are reported by src/main.tsx. Nothing is inferred from a
       * clock, so on a fast connection this is gone before anybody reads it.
       *
       * The floor is 400ms and exists only so a very fast start does not flash
       * a screen for two frames. There is no ceiling: a slow start is shown for
       * as long as it takes, with the seconds counted honestly.
       */
      ;(function () {
        // The theme is NOT read here. It is decided by the script in <head>,
        // which is the only place early enough - see the comment there. This
        // one runs after #boot is already in the document, which is exactly
        // why it was the wrong place for it.
        var boot = document.getElementById('boot')
        if (!boot) return

        var startedAt = Date.now()
        var FLOOR_MS = 400
        var note = boot.querySelector('.note')

        // A connection the browser already knows is poor: slow the mark down so
        // it reads as patient rather than frantic, and say something sooner.
        var link =
          navigator.connection || navigator.mozConnection || navigator.webkitConnection || null
        var poor = !!(link && (link.saveData || /^(slow-2g|2g)$/.test(link.effectiveType || '')))
        if (poor) boot.style.setProperty('--dur', '3.6s')

        var step = 0
        boot.setAttribute('data-step', '1')

        // What to say while waiting, indexed by how far the load actually got.
        // Before the module runs the browser is downloading it; after, the app
        // is starting. Those are the only two states there are to be in.
        var SAYING = ['Downloading the app', 'Starting up']

        var ticker = window.setInterval(function () {
          var seconds = Math.floor((Date.now() - startedAt) / 1000)
          // Silence until the wait is long enough that a person is wondering.
          if (seconds < (poor ? 1 : 3)) return
          boot.setAttribute('data-waiting', '')
          if (note) note.textContent = SAYING[Math.min(step, 1)] + ' · ' + seconds + 's'
        }, 500)

        window.__prismBoot = {
          /** Called by the app as it gets further. Never goes backwards. */
          step: function (reached) {
            if (reached > step) step = reached
            boot.setAttribute('data-step', String(Math.min(step + 1, 3)))
          },

          /** The app is up. Take the screen down, and stop counting. */
          done: function () {
            window.clearInterval(ticker)
            var wait = Math.max(0, FLOOR_MS - (Date.now() - startedAt))
            window.setTimeout(function () {
              boot.setAttribute('data-done', '')
              boot.addEventListener('transitionend', function () { boot.remove() }, { once: true })
              // A browser that skipped the transition entirely — reduced
              // motion, a background tab — never fires transitionend, so the
              // node is swept anyway. A fixed overlay left in the document is a
              // transparent sheet over every click on the page underneath.
              window.setTimeout(function () { boot.remove() }, 600)
            }, wait)
          },
        }
      })()
    </script>

    <div id="root"></div>

    <noscript>
      <!-- index.css is imported by the module below, so with scripting off
           there is no stylesheet at all. These styles have to be inline. -->
      <div
        style="
          max-width: 940px;
          margin: 0 auto;
          padding: 4rem 1.5rem;
          background: #fffdf9;
          color: #1c1815;
          font-family: ui-sans-serif, system-ui, sans-serif;
          font-size: 15px;
          line-height: 1.6;
        "
      >
        <p
          style="
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #776e63;
            margin: 0 0 0.75rem;
          "
        >
          Scripting off
        </p>
        <h1 style="font-size: 24px; margin: 0 0 0.75rem; font-weight: 700">
          PRISM needs JavaScript
        </h1>
        <p style="margin: 0">
          The whole quotation pad is rendered in the browser. Enable JavaScript
          for this site and reload to prepare a quotation.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
